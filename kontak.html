<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - XI RPL 1</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #eef2f5;
      /* Pattern background bintik-bintik halus seperti gambar */
      background-image: radial-gradient(#b0bec5 1px, transparent 1px);
      background-size: 16px 16px;
      color: #333;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .main-card {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    /* Header Gradient Biru-Ungu */
    .header-banner {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      text-align: center;
      padding: 30px 20px;
      border-radius: 20px 20px 0 0;
    }

    .header-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .header-banner h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    /* Content Area */
    .content {
      padding: 24px 28px;
    }

    /* Info Banner / Peringatan Ringkas */
    .info-banner {
      background: #f0fdf4;
      border-left: 4px solid #22c55e;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      color: #166534;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .info-banner i {
      font-size: 1.2rem;
      color: #22c55e;
    }

    /* Form Section */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .form-label i {
      color: #2563eb;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #1e293b;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Tombol Kirim */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 24px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    /* Footer / Navigasi Balik */
    .footer-links {
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
    }

    .footer-links a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0 10px;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <!-- Header Banner -->
    <div class="header-banner">
      <div class="header-badge">SMK NEGERI 1 GARUT</div>
      <h1>Hubungi Kelas XI RPL 1</h1>
    </div>

    <!-- Content Area -->
    <div class="content">
      
      <!-- Info Singkat -->
      <div class="info-banner">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Punya pertanyaan atau saran untuk kelas kami? Silakan kirimkan pesan di bawah ini!</span>
      </div>

      <!-- Form Kontak -->
      <form action="#" method="post">
        
        <div class="form-group">
          <label class="form-label" for="nama">
            <i class="fa-solid fa-user"></i> Nama Lengkap
          </label>
          <input type="text" id="nama" class="form-input" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            <i class="fa-solid fa-envelope"></i> Email
          </label>
          <input type="email" id="email" class="form-input" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="pesan">
            <i class="fa-solid fa-comment-dots"></i> Pesan
          </label>
          <textarea id="pesan" class="form-textarea" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-paper-plane"></i> Kirim Pesan
        </button>

      </form>

      <!-- Navigasi Footer -->
      <div class="footer-links">
        <a href="profil.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke Profil</a>
      </div>

    </div>
  </div>

</body>
</html>
